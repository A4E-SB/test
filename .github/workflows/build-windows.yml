# ============================================================================
#  Himaya — build the ALL-IN-ONE Windows installer (setup.exe) on GitHub.
#
#  Two ways to trigger:
#    1. Push a tag:  git tag v1.0.0 && git push origin v1.0.0
#       -> creates a GitHub Release with Himaya-Setup-x.y.z.exe attached
#    2. Actions tab -> "Build Windows installer" -> Run workflow
#
#  The setup.exe bundles everything: app + Python runtime + Tesseract OCR,
#  so end users install with zero prerequisites, fully offline.
#  It is also always available as a downloadable artifact.
# ============================================================================

name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    # v1.7.3: the whole battery gates the build — no exe ships unless
    # core / features / packaging / e2e-journey / ui-smoke are green.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Lint + full test battery
        run: |
          python -m pyflakes himaya/ main.py tests/
          python3 tests/test_core.py
          python3 tests/test_v11.py
          python3 tests/test_packaging.py
          python3 tests/test_e2e.py
          python3 tests/test_ui_smoke.py

  build:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build portable exe (PyInstaller)
        run: pyinstaller --noconfirm himaya.spec

      - name: Verify bundled runtime files (freeze regression guard)
        shell: pwsh
        run: |
          # files the app reads from disk at runtime MUST be in the bundle
          $need = @(
            "dist\Himaya\_internal\himaya\database\schema.sql",
            "dist\Himaya\_internal\assets\icon.png"
          )
          $missing = $need | Where-Object { !(Test-Path $_) }
          if ($missing) {
            Write-Host "Missing bundled files:"; $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "All runtime data files present in the bundle."

      - name: Stage Tesseract OCR bundle (offline, out of the box)
        shell: pwsh
        run: |
          choco install tesseract-ocr -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "installer\bundle\tesseract"
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null
          # engine binaries + dlls (skip docs and full language pack)
          Get-ChildItem $src |
            Where-Object { $_.Name -notin @("tessdata", "doc") } |
            Copy-Item -Destination $dst -Recurse -Force
          # keep only the languages Himaya uses (receipts are FR/EN)
          $keep = @("eng.traineddata", "osd.traineddata", "fra.traineddata")
          Get-ChildItem "$src\tessdata" -Filter *.traineddata -ErrorAction SilentlyContinue |
            Where-Object { $keep -contains $_.Name } |
            Copy-Item -Destination "$dst\tessdata" -Force
          # make sure eng+fra are present whatever the installer shipped
          foreach ($lang in @("eng", "fra")) {
            if (!(Test-Path "$dst\tessdata\$lang.traineddata")) {
              Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" `
                -OutFile "$dst\tessdata\$lang.traineddata" -UseBasicParsing
            }
          }
          $sum = (Get-ChildItem $dst -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("OCR bundle staged: {0:N1} MB" -f ($sum / 1MB))

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Using ISCC: $iscc"

      - name: Compile installer
        id: compile
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" "installer\\himaya.iss" 2>&1 |
            Tee-Object -FilePath iscc-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report compile error (commit comment, readable without log access)
        if: failure() && steps.compile.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content iscc-output.log -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
          if (-not $tail) { $tail = "(no ISCC output captured)" }
          $body = "**ISCC compile failed** (run ${{ github.run_id }}):``````text`n$tail`n``````"
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" `
            -Method Post `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -ContentType "application/json" `
            -Body $payload | Out-Null
          Write-Host "failure comment posted"

      - name: Upload ISCC log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc-output.log
          if-no-files-found: ignore

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Setup
          path: installer/output/Himaya-Setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/Himaya-Setup-*.exe

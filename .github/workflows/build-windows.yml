# ============================================================================
#  Himaya — build the Windows installer (setup.exe) automatically on GitHub.
#
#  Two ways to trigger:
#    1. Push a tag:  git tag v1.0.0 && git push origin v1.0.0
#       -> creates a GitHub Release with Himaya-Setup-x.y.z.exe attached
#    2. Actions tab -> "Build Windows installer" -> Run workflow
#
#  The resulting setup.exe is also always available as a build artifact.
# ============================================================================

name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build portable exe (PyInstaller)
        run: pyinstaller --noconfirm himaya.spec

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Using ISCC: $iscc"

      - name: Compile installer
        run: '& "${{ steps.iscc.outputs.path }}" installer\himaya.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himaya-Setup
          path: installer/output/Himaya-Setup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/Himaya-Setup-*.exe
